version 15.1X49-D150.2;
system {
    host-name homesecurity;
    time-zone GMT-3;
    root-authentication {
        encrypted-password "<REDACTED>"
    }
    name-server {
        1.1.1.1;
        9.9.9.9;
        8.8.8.8;
        8.8.4.4;
    }
    name-resolution {
        no-resolve-on-input;
    }
    login {
        user cfgadmin {
            uid 2001;
            class super-user;
            authentication {
                ssh-rsa "<REDACTED>"; ## SECRET-DATA
            }
        }
    }
    services {
        ssh {
            no-passwords;
        }
        xnm-clear-text;
        dhcp-local-server {
            group desktop {
                interface ge-0/0/2.0;
            }
            group wifi {
                interface ge-0/0/3.0;
            }
        }
        web-management {
            https {
                system-generated-certificate;
            }
            session {
                idle-timeout 60;
            }
        }
    }
    syslog {
        archive size 100k files 3;
        user * {
            any emergency;
        }
        file messages {
            any notice;
            authorization info;
        }
        file interactive-commands {
            interactive-commands any;
        }
    }
    max-configurations-on-flash 5;
    max-configuration-rollbacks 5;
    license {
        autoupdate {
            url https://ae1.juniper.net/junos/key_retrieval;
        }
    }
    ntp {
        server us.ntp.pool.org;
    }
}
services {
    rpm {
        probe WAN-PROBE {
            test ISP0 {
                probe-type icmp-ping;
                target address 8.8.8.8;
                probe-count 5;
                probe-interval 3;
                test-interval 10;
                thresholds {
                    successive-loss 3;
                }
                destination-interface ge-0/0/0.0;
            }
        }
    }
    ip-monitoring {
        policy WAN-FAILOVER {
            match {
                rpm-probe WAN-PROBE;
            }
            then {
                preferred-route {
                    route 0.0.0.0/0 {
                        next-hop 100.68.224.1;
                        preferred-metric 1;
                    }
                }
            }
        }
    }
}
security {
    log {
        mode stream;
        report;
    }
    screen {
        ids-option untrust-screen {
            icmp {
                ping-death;
            }
            ip {
                source-route-option;
                tear-drop;
            }
            tcp {
                syn-flood {
                    alarm-threshold 1024;
                    attack-threshold 200;
                    source-threshold 1024;
                    destination-threshold 2048;
                    timeout 20;
                }
                land;
            }
        }
    }
    nat {
        source {
            rule-set desktop_srcnat {
                from zone desktop;
                to zone Internet;
                rule desktop-snat {
                    match {
                        source-address 10.60.254.0/24;
                        destination-address 0.0.0.0/0;
                    }
                    then {
                        source-nat {
                            interface;
                        }
                    }
                }
            }
            rule-set wifi_srcnat {
                from zone wifi;
                to zone Internet;
                rule wifi-snat {
                    match {
                        source-address 172.16.254.0/24;
                        destination-address 0.0.0.0/0;
                    }
                    then {
                        source-nat {
                            interface;
                        }
                    }
                }
            }
        }
    }
    policies {
        from-zone desktop to-zone Internet {
            policy All_desktop_Internet {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone wifi to-zone Internet {
            policy All_wifi_Internet {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone desktop to-zone wifi {
            policy All_desktop_wifi {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone wifi to-zone desktop {
            policy All_desktop_wifi {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
    zones {
        security-zone desktop {
            interfaces {
                ge-0/0/2.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                            dhcp;
                            https;
                            ssh;
                        }
                    }
                }
            }
        }
        security-zone wifi {
            interfaces {
                ge-0/0/3.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                            dhcp;
                            ssh;
                        }
                    }
                }
            }
        }
        security-zone Internet {
            interfaces {
                ge-0/0/0.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                            dhcp;
                        }
                    }
                }
                ge-0/0/1.0 {
                    host-inbound-traffic {
                        system-services {
                            dhcp;
                            ping;
                        }
                    }
                }
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                dhcp-client {
                    update-server;
                }
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                dhcp-client {
                    update-server;
                }
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                address 10.60.254.1/24;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            family inet {
                address 172.16.254.1/24;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 {
            next-hop 192.168.15.1;
            qualified-next-hop 100.68.224.1 {
                preference 25;
            }
            preference 5;
        }
    }
}
protocols {
    l2-learning {
        global-mode switching;
    }
    rstp {
        interface all;
    }
}
access {
    address-assignment {
        pool desktop {
            family inet {
                network 10.60.254.0/24;
                range 10 {
                    low 10.60.254.10;
                    high 10.60.254.254;
                }
                dhcp-attributes {
                    name-server {
                        1.1.1.1;
                        9.9.9.9;
                    }
                    router {
                        10.60.254.1;
                    }
                }
            }
        }
        pool wifi {
            family inet {
                network 172.16.254.0/24;
                range 10 {
                    low 172.16.254.10;
                    high 172.16.254.254;
                }
                dhcp-attributes {
                    name-server {
                        1.1.1.1;
                        9.9.9.9;
                    }
                    router {
                        172.16.254.1;
                    }
                }
                host ap-wifi {
                    hardware-address d8:44:89:13:c3:25;
                    ip-address 172.16.254.10;
                }
            }
        }
    }
}
